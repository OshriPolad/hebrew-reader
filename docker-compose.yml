services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - appdata:/data          # database + audio survive rebuilds
    expose:
      - "8000"                 # reachable only by caddy, not the internet

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # HTTPS certificates
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
